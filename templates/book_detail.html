<h1>{{ book_id.title }}</h1>
<img src="{{ book_id.image.url }}" alt="" width="300" height="250">
<p>Автор - {{ book_id.author }}</p>
<p>Описание - {{ book_id.description }}</p>
<p>Год издания - {{ book_id.year }}</p>
<p>Страниц - {{ book_id.pages }}</p>
<p>Жанр - {{ book_id.genre }}</p>
<p>Возрастное ограничение - {{ book_id.age }}+</p>
<a href="{{ book_id.url_blog }}">Ссылка на Литрес</a>
<p>Дата добавления - {{ book_id.created_at }}</p>
