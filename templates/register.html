<h1>Регистрация</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    
    {% if form.errors %}
        <div style="color: red;">
            <p>ошибка:</p>
            {{ form.errors }}
        </div>
    {% endif %}
    
    {{ form.as_p }}
    <button type="submit">Регистрация</button>
</form>
